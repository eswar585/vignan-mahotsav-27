<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login | MAHOTSAV 2027</title>
    <meta name="description" content="Secure login for Mahotsav 2027 approved participants and administrators via Supabase Auth.">

    <!-- CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/mahotsav-theme.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>

    <!-- Site Header -->
    <header class="site-header" id="site-header">
        <div class="container nav-container">
            <a href="index.html" class="brand-wrapper">
                <img src="clg.png" alt="Vignan University Logo" class="brand-logo-img">
                <div class="brand-divider"></div>
                <div class="brand-titles">
                    <span class="brand-fest-name">MAHOTSAV</span>
                    <span class="brand-fest-sub">Auth Portal</span>
                </div>
            </a>

            <nav>
                <ul class="nav-menu" id="nav-menu">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="events.html" class="nav-link">Events</a></li>
                    <li><a href="register.html" class="nav-link">Register</a></li>
                    <li><a href="status.html" class="nav-link">Check Status</a></li>
                </ul>
            </nav>

            <div class="nav-actions">
                <a href="register.html" class="btn btn-gold btn-sm">Register Now</a>
            </div>
        </div>
    </header>

    <main style="padding-top: calc(var(--nav-height) + 3.5rem); padding-bottom: 5rem; min-height: 80vh; display: flex; align-items: center;">
        <div class="container" style="max-width: 480px;">
            <div class="glass-card" style="padding: 2.5rem 2rem;">
                <div style="text-align: center; margin-bottom: 2rem;">
                    <span style="font-size: 0.78rem; color: var(--color-amber-gold); text-transform: uppercase; letter-spacing: 2px; font-weight: 700;">SECURE ACCESS</span>
                    <h1 style="font-size: 1.9rem; margin-top: 0.3rem; margin-bottom: 0.4rem;">Portal Login</h1>
                    <p style="color: var(--color-text-secondary); font-size: 0.88rem;">
                        Sign in with your Email Address or Mahotsav ID (MHID)
                    </p>
                </div>

                <div id="login-error-box" style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #f87171; padding: 0.85rem 1rem; border-radius: var(--radius-md); font-size: 0.88rem; margin-bottom: 1.5rem;"></div>

                <form id="login-form" novalidate>
                    <div class="form-group">
                        <label class="form-label" for="login-id">Email Address or MHID <span class="required">*</span></label>
                        <input type="text" id="login-id" class="form-control" placeholder="e.g. participant@email.com or MH270001" required autofocus>
                    </div>

                    <div class="form-group">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem;">
                            <label class="form-label" for="login-password" style="margin-bottom: 0;">Password <span class="required">*</span></label>
                            <a href="#" onclick="handleForgotPassword(event)" style="font-size: 0.78rem; color: var(--color-amber-bright);">Forgot Password?</a>
                        </div>
                        <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required>
                    </div>

                    <button type="submit" class="btn btn-gold btn-lg btn-block pulse-glow" id="btn-submit-login" style="margin-top: 1rem;">
                        Sign In &rarr;
                    </button>
                </form>

                    <div style="text-align: center; margin-top: 2rem; font-size: 0.88rem; color: var(--color-text-secondary);">
                        Don't have an account yet? <a href="register.html" style="color: var(--color-amber-bright); font-weight: 700;">Register Here</a>
                    </div>
            </div>
        </div>
    </main>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/music.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const err = urlParams.get("error");
            if (err === "admin_required") {
                const box = document.getElementById("login-error-box");
                box.textContent = "Administrative privileges required. Please sign in with an authorized administrator account.";
                box.style.display = "block";
            }
        });

        const form = document.getElementById("login-form");
        const errBox = document.getElementById("login-error-box");
        const submitBtn = document.getElementById("btn-submit-login");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            errBox.style.display = "none";

            const loginId = document.getElementById("login-id").value.trim();
            const password = document.getElementById("login-password").value;

            if (!loginId || !password) {
                errBox.textContent = "Please enter both Email/MHID and password.";
                errBox.style.display = "block";
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span>Authenticating...</span>`;

            try {
                const { user, profile } = await MahotsavService.login(loginId, password);

                showToast(`Welcome back, ${profile.name}!`, "success");

                setTimeout(() => {
                    const redirectUrl = sessionStorage.getItem("mahotsav_redirect_after_login");
                    sessionStorage.removeItem("mahotsav_redirect_after_login");

                    if (profile.role === "admin") {
                        window.location.href = redirectUrl || "admin.html";
                    } else {
                        window.location.href = redirectUrl || "dashboard.html";
                    }
                }, 900);
            } catch (err) {
                console.error("Login failed:", err);
                errBox.textContent = err.message || "Invalid credentials. Please verify your Email/MHID and password.";
                errBox.style.display = "block";
                submitBtn.disabled = false;
                submitBtn.innerHTML = `Sign In &rarr;`;
            }
        });

        function handleForgotPassword(e) {
            e.preventDefault();
            const email = prompt("Enter your registered email address to receive password reset instructions:");
            if (email) {
                showToast(`Password reset link sent to ${email} (via Supabase Auth)`, "info");
            }
        }
    </script>
</body>
</html>
